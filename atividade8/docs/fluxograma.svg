<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Fluxograma do pipeline de streaming da Atividade 8</title>
  <desc id="desc">Arquivos JSON sao publicados em Kafka, processados pelo Spark, enriquecidos via PostgreSQL e gravados em JSON.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f1e8"/>
      <stop offset="1" stop-color="#e5eef0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#173042" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#287276"/>
    </marker>
    <style>
      .title { font: 700 32px Georgia, serif; fill: #173042; }
      .subtitle { font: 16px Arial, sans-serif; fill: #52666b; }
      .label { font: 700 19px Arial, sans-serif; fill: #173042; }
      .detail { font: 15px Arial, sans-serif; fill: #52666b; }
      .small { font: 700 14px Arial, sans-serif; fill: #287276; }
      .box { stroke: #173042; stroke-width: 2; rx: 16; filter: url(#shadow); }
      .line { stroke: #287276; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #ba6b3c; stroke-width: 3; stroke-dasharray: 9 8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1400" height="760" fill="url(#background)"/>
  <circle cx="1290" cy="85" r="120" fill="#d5e6e2" opacity="0.7"/>
  <circle cx="110" cy="680" r="150" fill="#f1d9c7" opacity="0.6"/>
  <text x="70" y="76" class="title">Atividade 8 | Pipeline de streaming</text>
  <text x="70" y="108" class="subtitle">Da fonte JSON ao resultado enriquecido, com processamento em micro-batches</text>

  <rect x="70" y="190" width="230" height="150" fill="#f1d9c7" class="box"/>
  <text x="185" y="233" text-anchor="middle" class="label">Fontes JSON</text>
  <text x="185" y="266" text-anchor="middle" class="detail">bancos, empregados</text>
  <text x="185" y="289" text-anchor="middle" class="detail">e reclamacoes</text>
  <text x="185" y="320" text-anchor="middle" class="small">producer.py</text>

  <rect x="380" y="190" width="230" height="150" fill="#d5e6e2" class="box"/>
  <text x="495" y="233" text-anchor="middle" class="label">Kafka</text>
  <text x="495" y="266" text-anchor="middle" class="detail">topico dados-brutos</text>
  <text x="495" y="292" text-anchor="middle" class="detail">porta local 9092</text>
  <text x="495" y="320" text-anchor="middle" class="small">fila de eventos</text>

  <rect x="690" y="165" width="280" height="200" fill="#c9dce5" class="box"/>
  <text x="830" y="210" text-anchor="middle" class="label">Spark Structured</text>
  <text x="830" y="237" text-anchor="middle" class="label">Streaming</text>
  <text x="830" y="274" text-anchor="middle" class="detail">le e transforma micro-batches</text>
  <text x="830" y="300" text-anchor="middle" class="detail">checkpoint para retomada</text>
  <text x="830" y="337" text-anchor="middle" class="small">consumer.py</text>

  <rect x="1050" y="190" width="280" height="150" fill="#e9d8b7" class="box"/>
  <text x="1190" y="233" text-anchor="middle" class="label">PostgreSQL</text>
  <text x="1190" y="266" text-anchor="middle" class="detail">banco_enquadramento</text>
  <text x="1190" y="292" text-anchor="middle" class="detail">JDBC | porta 5432</text>
  <text x="1190" y="320" text-anchor="middle" class="small">lookup carregado</text>

  <path d="M300 265 H380" class="line"/>
  <path d="M610 265 H690" class="line"/>
  <path d="M970 265 H1050" class="dashed"/>
  <text x="1010" y="246" text-anchor="middle" class="small">consulta JDBC</text>

  <polygon points="830,465 950,535 830,605 710,535" fill="#fff4d8" stroke="#173042" stroke-width="2" filter="url(#shadow)"/>
  <text x="830" y="530" text-anchor="middle" class="label">CNPJ ou nome</text>
  <text x="830" y="555" text-anchor="middle" class="label">encontrado?</text>

  <rect x="340" y="625" width="280" height="90" fill="#d5e6e2" class="box"/>
  <text x="480" y="663" text-anchor="middle" class="label">Saida enriquecida</text>
  <text x="480" y="690" text-anchor="middle" class="detail">JSON | enriquecido=true</text>

  <rect x="1040" y="625" width="280" height="90" fill="#f1d9c7" class="box"/>
  <text x="1180" y="663" text-anchor="middle" class="label">Sem correspondencia</text>
  <text x="1180" y="690" text-anchor="middle" class="detail">JSON | enriquecido=false</text>

  <path d="M830 365 V465" class="line"/>
  <path d="M710 535 H480 V625" class="line"/>
  <path d="M950 535 H1180 V625" class="line"/>
  <text x="590" y="520" text-anchor="middle" class="small">sim</text>
  <text x="1030" y="520" text-anchor="middle" class="small">nao</text>
  <text x="70" y="735" class="subtitle">Inicializacao: load_lookup.py prepara a tabela; docker-compose sobe Kafka, PostgreSQL e Spark.</text>
</svg>