services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_atividade_01
    restart: always
    environment:
      POSTGRES_DB: atividades
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - ./volume/postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d atividades"]
      interval: 5s
      timeout: 5s
      retries: 5

  hop:
    image: apache/hop-web:2.8.0
    container_name: hop_atividade_01
    restart: always
    ports:
      - "8080:8080"
    environment:
      - HOP_SERVER_PORT=8080
      - HOP_PROJECT_DIRECTORY=/project/atividade_01/hop
      - HOP_PROJECT_NAME=atividade_01
    volumes:
      - ../:/project
      - ./volume/hop:/root/.hop
    depends_on:
      postgres:
        condition: service_healthy
