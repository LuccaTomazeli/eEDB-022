services:
  postgres:
    image: postgres
    container_name: postgres_atividade_01
    restart: always
    environment:
      POSTGRES_DB: atividade_01
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
  hop:
    image: apache/hop-web
    container_name: hop_atividade_01
    user: "${UID}:${GID}"
    restart: always
    ports:
      - "8080:8080"
    environment:
      - HOP_SERVER_PORT=8080
    volumes:
      - ./volume/hop:/usr/local/tomcat/webapps/ROOT/config/projects/default
      - ../Dados:/usr/local/tomcat/webapps/ROOT/config/projects/default/dados
    depends_on:
      - postgres
